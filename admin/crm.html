<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM & Panel de Control de Ventas — Julio César Machado</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161920;
      --text: #f0f2f5;
      --accent: #d97706;
      --accent-hover: #b45309;
      --border: #2a2e39;
      --success: #10b981;
      --info: #3b82f6;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }
    h1 { font-weight: 300; margin: 0; font-size: 1.8rem; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.2rem;
      border-radius: 8px;
      text-align: center;
    }
    .stat-card h4 { margin: 0 0 0.5rem 0; font-size: 0.85rem; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px; }
    .stat-card .val { font-size: 1.8rem; font-weight: 700; color: var(--accent); }

    .filter-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th {
      background: #1a1e28;
      color: #a0aec0;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }
    tr:hover { background: #1f232e; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-listo { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid #10b981; }
    .badge-por { background: rgba(217, 119, 6, 0.2); color: #fde68a; border: 1px solid #d97706; }
    .btn-action {
      background: var(--info);
      color: #fff;
      text-decoration: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
    }
    .btn-action:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>📋 Panel de Control CRM — jcmachado.com</h1>
        <p style="color: #a0aec0; margin: 0.3rem 0 0 0; font-size: 0.9rem;">Gestión de prospectos, clientes B2B y oportunidades de nicho</p>
      </div>
      <div>
        <a href="ventas.html" style="color: #a0aec0; text-decoration: none; margin-right: 1rem;">Ventas</a>
        <a href="precios.html" style="color: #a0aec0; text-decoration: none;">Precios</a>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <h4>Total Prospectos</h4>
        <div class="val" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <h4>Con Email</h4>
        <div class="val" id="stat-listos" style="color: var(--success);">0</div>
      </div>
      <div class="stat-card">
        <h4>Con WhatsApp</h4>
        <div class="val" id="stat-wsp" style="color: #3b82f6;">0</div>
      </div>
      <div class="stat-card">
        <h4>Galerías</h4>
        <div class="val" id="stat-gal">0</div>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filtrar('todos')">Todos</button>
      <button class="filter-btn" onclick="filtrar('email')">Con Email</button>
      <button class="filter-btn" onclick="filtrar('wsp')">WhatsApp</button>
      <button class="filter-btn" onclick="filtrar('Galería')">Galerías</button>
      <button class="filter-btn" onclick="filtrar('Hotel')">Hoteles</button>
      <button class="filter-btn" onclick="filtrar('Interiorismo')">Interiorismo</button>
      <button class="filter-btn" onclick="filtrar('Arquitectura')">Arquitectura</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Empresa / Estudio</th>
          <th>Categoría</th>
          <th>Ciudad</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="crm-table-body">
        <tr><td colspan="7" style="text-align:center;">Cargando datos del CRM...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let todosProspectos = [];

    async function cargarCRM() {
      try {
        const res = await fetch('../data/prospects_crm.json');
        const data = await res.json();
        todosProspectos = data.prospects || [];
        renderTabla(todosProspectos);
        actualizarStats();
      } catch (err) {
        document.getElementById('crm-table-body').innerHTML = '<tr><td colspan="7" style="text-align:center; color:#f87171;">No pude cargar los datos del CRM.</td></tr>';
      }
    }

    function waLink(tel, empresa) {
      if (!tel) return null;
      const d = String(tel).replace(/\D/g, '');
      if (!d) return null;
      let num = d.startsWith('54') ? d : '54' + d.replace(/^0/, '');
      const msg = encodeURIComponent('Hola! Le escribo desde jcmachado.com, sitio de arte de Julio César Machado. ¿Les interesaría ver obra original para su espacio?');
      return `https://wa.me/${num}?text=${msg}`;
    }

    function renderTabla(lista) {
      const tbody = document.getElementById('crm-table-body');
      tbody.innerHTML = '';
      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No hay prospectos en este filtro.</td></tr>';
        return;
      }
      lista.forEach(p => {
        const tr = document.createElement('tr');
        const cat = p.categoria || p.nicho || '—';
        const mailLink = p.email ? `<a href="mailto:${p.email}" class="btn-action" style="background:#10b981;margin-bottom:0.3rem;">✉️</a>` : '';
        const wsp = waLink(p.telefono, p.empresa);
        const wspLink = wsp ? `<a href="${wsp}" target="_blank" rel="noopener" class="btn-action" style="background:#22c55e;">WhatsApp</a>` : '';
        const tel = p.telefono ? `<a href="tel:${String(p.telefono).replace(/\s/g, '')}" style="color:#a0aec0;">${p.telefono}</a>` : '—';
        const esListo = !!p.email;
        tr.innerHTML = `
          <td><strong>${p.empresa}</strong></td>
          <td>${cat}</td>
          <td>${p.ciudad || '—'}</td>
          <td>${p.email || '—'}</td>
          <td>${tel}</td>
          <td><span class="badge ${esListo ? 'badge-listo' : 'badge-por'}">${esListo ? 'Listo' : 'Por contactar'}</span></td>
          <td>${mailLink}${wspLink}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function actualizarStats() {
      document.getElementById('stat-total').textContent = todosProspectos.length;
      document.getElementById('stat-listos').textContent = todosProspectos.filter(p => p.email).length;
      document.getElementById('stat-wsp').textContent = todosProspectos.filter(p => p.telefono).length;
      document.getElementById('stat-gal').textContent = todosProspectos.filter(p => (p.categoria || '').includes('Galería')).length;
    }

    function filtrar(criterio) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      if (criterio === 'todos') {
        renderTabla(todosProspectos);
      } else if (criterio === 'email') {
        renderTabla(todosProspectos.filter(p => p.email));
      } else if (criterio === 'wsp') {
        renderTabla(todosProspectos.filter(p => p.telefono));
      } else {
        renderTabla(todosProspectos.filter(p => (p.categoria || '').includes(criterio)));
      }
    }

    cargarCRM();
  </script>
</body>
</html>
