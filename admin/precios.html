  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizador de Precios — Julio César Machado</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161920;
      --text: #f0f2f5;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #2a2e39;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { font-weight: 300; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    .box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    input[type="number"] {
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #090a0f;
      color: #fff;
      font-size: 1rem;
      width: 150px;
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-left: 0.5rem;
    }
    .btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="container">
    <h1>💲 Actualizador Masivo de Precios</h1>
    <div class="box">
      <h3>Aumento porcentual general (Ajuste por Inflación)</h3>
      <label for="porcentaje">Porcentaje de incremento (%):</label>
      <input type="number" id="porcentaje" value="15" min="1" max="200">
      <button class="btn" onclick="aplicarAumento()">Calcular Precios Nuevos</button>
    </div>
    <div id="resultado"></div>
  </div>

  <script>
    function aplicarAumento() {
      const pct = parseFloat(document.getElementById('porcentaje').value);
      if (isNaN(pct)) return;
      document.getElementById('resultado').innerHTML = `
        <div class="box">
          <h4>Simulación de ajuste (+${pct}%):</h4>
          <p>Óleo Original Base ($250.000) ➔ <strong>$${Math.round(250000 * (1 + pct/100)).toLocaleString('es-AR')}</strong></p>
          <p>Print A3 Base ($30.000) ➔ <strong>$${Math.round(30000 * (1 + pct/100)).toLocaleString('es-AR')}</strong></p>
        </div>
      `;
    }
  </script>
</body>
</html>
